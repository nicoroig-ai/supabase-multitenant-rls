name: RLS isolation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  isolation:
    runs-on: ubuntu-latest

    # A real Postgres, not a mock. The point of these tests is that the
    # database enforces isolation, so anything short of a database proves
    # nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
